<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Checkout</h2>
        <form action="#" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" class="fixed-input">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" class="fixed-input">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="fixed-input">
                </div>
                <div class="form-group">
                    <label>Please enter your very long shipping address here</label>
                    <input type="text" name="address" class="fixed-input">
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary">Cancel Transaction</button>
                <button type="submit" class="btn btn-primary">Complete Secure Payment</button>
            </div>
        </form>
    </div>
</body>
</html>
