<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dense Action Toolbar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    * { box-sizing: inherit; }
  </style>
</head>
<body>
  <div style="display: flex; gap: 16px; padding: 24px; background: #eee;">
    <button>Edit Profile</button>
    <button>Change Password</button>
    <button>Manage Notifications</button>
    <button>Billing</button>
    <button>Danger Zone</button>
  </div>
</body>
</html>
