  <div style="display: flex; gap: clamp(16px, 4vw, 32px); padding: 24px; align-items: center; justify-content: space-between; background: #fafafa; flex-wrap: wrap;">

    <div style="display: flex; gap: 16px; flex: 0 0 auto;">
      <div style="width: 24px; height: 24px; background: #ccc; border-radius: 50%;"></div>
      <div style="width: 24px; height: 24px; background: #ccc; border-radius: 50%;"></div>

    </div>
