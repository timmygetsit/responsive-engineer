<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed Sidebar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    * { box-sizing: inherit; }
  </style>
</head>
<body>
  <div style="display: flex; padding: 16px; flex-wrap: wrap;">
    <div style="flex: 1 1 300px; background: #fafafa; padding: 16px;">
      <h2>Fixed Sidebar</h2>
      <ul><li>Item 1</li><li>Item 2</li></ul>
    </div>
    <div style="flex: 1 1 300px; padding: 16px;">
      <h2>Main Content</h2>
    </div>
  </div>
</body>
</html>
