<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broken Two Column Hero</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    * { box-sizing: inherit; }
  </style>
</head>
<body>
  <div style="display: flex; gap: 32px; padding: 24px; flex-wrap: wrap;">
    <div style="flex: 1 1 300px;">
      <h1>Hero Text</h1>
      <p>This is a hero description.</p>
    </div>
    <div style="flex: 1 1 300px; background: #eee; padding: 24px;">
      <h2>Supporting Card</h2>
    </div>
  </div>
</body>
</html>
